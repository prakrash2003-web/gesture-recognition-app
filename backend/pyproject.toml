# Configuration for the backend's tooling (ruff and pytest).
# pyproject.toml is the modern, standard place for Python tool settings - one file
# instead of several (.ruff.toml, pytest.ini, setup.cfg ...).

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/W = style errors/warnings   F = real bugs (undefined names, unused imports)
# I   = import ordering          UP = prefer modern Python syntax   B = likely-bug patterns
select = ["E", "W", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
# Let the tests run `from app.main import app` when pytest is launched from backend/.
pythonpath = ["."]
testpaths = ["tests"]
